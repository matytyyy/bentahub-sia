<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BentaHub | Safe-Meetup Marketplace Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #0f766e; outline-offset: 2px; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">
  <header class="bg-teal-800 text-white">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <h1 class="text-xl font-bold mr-auto">BentaHub <span class="font-normal text-teal-200 text-sm">safe-meetup marketplace console</span></h1>
      <div id="loader" class="hidden w-5 h-5 border-2 border-teal-300 border-t-white rounded-full spin" role="status" aria-label="Loading"></div>
      <form id="loginForm" class="flex flex-wrap items-center gap-2 text-sm">
        <input id="loginUser" placeholder="username" autocomplete="username" class="px-2 py-1 rounded text-stone-900 w-28">
        <input id="loginPass" type="password" placeholder="password" autocomplete="current-password" class="px-2 py-1 rounded text-stone-900 w-28">
        <button class="bg-white text-teal-900 font-semibold px-3 py-1 rounded hover:bg-teal-50">Log in</button>
      </form>
      <div id="whoami" class="hidden text-sm flex items-center gap-2">
        <span id="whoText"></span>
        <button id="logoutBtn" class="underline">Log out</button>
      </div>
    </div>
    <nav id="tabs" class="max-w-7xl mx-auto px-4 flex flex-wrap gap-1 text-sm" aria-label="Screens"></nav>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-5 grid grid-cols-1 lg:grid-cols-3 gap-5">
    <section class="lg:col-span-2 space-y-4">
      <div>
        <h2 id="screenTitle" class="text-lg font-bold"></h2>
        <p id="screenHint" class="text-sm text-stone-600"></p>
      </div>
      <div id="errorBox" class="hidden bg-red-50 border border-red-300 text-red-800 rounded px-3 py-2 text-sm" role="alert"></div>
      <div id="toolbar" class="flex flex-wrap gap-2"></div>
      <form id="form" class="hidden bg-white border border-stone-200 rounded p-4 grid grid-cols-1 sm:grid-cols-2 gap-3"></form>
      <div>
        <h3 id="tableTitle" class="text-sm font-semibold text-stone-600 mb-1"></h3>
        <div class="bg-white border border-stone-200 rounded overflow-x-auto"><table id="table" class="min-w-full text-sm"></table></div>
      </div>
    </section>

    <aside class="lg:sticky lg:top-4 self-start bg-stone-900 rounded p-4 text-stone-100">
      <h2 class="text-sm font-semibold mb-1">Last API call</h2>
      <p id="logLine" class="text-xs text-stone-400 mb-2">Nothing sent yet. Log in, then use a screen.</p>
      <pre id="logBody" class="text-xs text-teal-300 overflow-auto max-h-[28rem] whitespace-pre-wrap"></pre>
    </aside>
  </main>

  <div id="toast" class="hidden fixed bottom-4 left-4 px-4 py-2 rounded shadow text-white" role="status"></div>

  <script src="js/core.js"></script>
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/zones.js"></script>
  <script src="js/screens/listings.js"></script>
  <script src="js/screens/meetups.js"></script>
  <script src="js/screens/chats.js"></script>
  <script src="js/screens/reviews.js"></script>
  <script>Screens.start();</script>
</body>
</html>
